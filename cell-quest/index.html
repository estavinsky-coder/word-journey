<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1527">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מסע אל תוך התא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one narrow game column, like a phone app. A "microscope night" world:
   deep ink background, glowing organelle colors, one card on screen at a time. */
:root{
  --bg:#0C1527; --bg2:#11203B; --card:#16274A; --card2:#1E345E; --line:#2C4675;
  --fg:#F2F6FC; --muted:#A7B7D4;
  --coral:#FF7A6B; --amber:#FFC34D; --teal:#3ED8C3; --violet:#AE91FF; --leaf:#7DD67F; --sky:#6CC4FF; --pink:#FF8FC7;
  --good:#5FE0A0; --bad:#FF6F7D;
  --cyto:rgba(108,196,255,.13); --vac:rgba(108,196,255,.32); --wall:#3E8E52;
  --display:"Secular One","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 85% -10%, rgba(174,145,255,.18), transparent 45%),
                   radial-gradient(circle at 0% 100%, rgba(62,216,195,.12), transparent 40%);
  color:var(--fg); font-family:var(--body); font-size:18.5px; line-height:1.6;
}
.wrap{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 64px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
button:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
h1,h2,h3{font-family:var(--display); font-weight:400; line-height:1.25; text-wrap:balance; margin:0}
b{color:var(--amber); font-weight:700}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  padding-block:12px; background:linear-gradient(var(--bg) 70%, transparent)}
.brand{display:flex; gap:8px; align-items:center; background:none; border:0; padding:0; font-family:var(--display); font-size:20px}
.brand svg{width:30px; height:30px}
.bar-r{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pill{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:14px; display:flex; gap:6px; align-items:center}
.pill.on{border-color:var(--amber); color:var(--amber)}
.xp{display:grid; grid-template-columns:auto auto; gap:2px 8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:5px 12px; font-size:13px}
.xp .lvl{font-weight:700; color:var(--teal)}
.xp .xpnum{font-variant-numeric:tabular-nums; color:var(--amber); font-weight:700}
.xpbar{grid-column:1/-1; height:5px; background:var(--bg2); border-radius:9px; overflow:hidden; min-width:110px}
.xpbar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--amber)); transition:width .6s}

/* buttons */
.btn{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 20px; font-weight:700; font-size:17px; transition:transform .12s, background .2s}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn.primary{background:var(--amber); color:#1B1405; border-color:transparent}
.btn.primary:disabled{background:var(--card2); color:var(--muted); cursor:not-allowed; transform:none; opacity:.6}
.btn.big{font-size:19px; padding:14px 26px}
.btn.ghost,.ghost{white-space:nowrap; background:none; border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:14px; color:var(--muted)}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,195,77,.55)}50%{box-shadow:0 0 0 10px rgba(255,195,77,0)}}

/* home */
.hero{padding-block:18px 8px; display:grid; gap:14px}
.count{display:inline-flex; gap:12px; align-items:center; align-self:start; justify-self:start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 16px 8px 12px; line-height:1.2}
.count .cnum{font-family:var(--display); font-size:40px; color:var(--coral); font-variant-numeric:tabular-nums}
.count small{color:var(--muted)}
.hero h1{font-size:clamp(34px,8vw,52px); color:var(--fg)}
.hero p{margin:0; color:var(--muted); max-width:58ch}
.hero .btn{justify-self:start}
.sec-h{font-family:var(--display); font-size:22px; margin:30px 0 12px}
.missions{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:14px}
.mcard{position:relative; text-align:right; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:grid; grid-template-columns:1fr auto; gap:4px 12px; overflow:hidden; transition:transform .15s, border-color .2s}
@media (hover:hover){.mcard:hover{transform:translateY(-3px); border-color:var(--mc)}}
.mcard::after{content:""; position:absolute; inset:auto -30px -60px auto; width:140px; height:140px; border-radius:50%; background:var(--mc); opacity:.16; filter:blur(10px)}
.mcard .tag{font-size:13px; color:var(--mc); font-weight:700; letter-spacing:.03em}
.mcard h3{font-size:23px}
.mcard p{margin:0; color:var(--muted); font-size:17px; grid-column:1}
.mcard .num{grid-row:1/span 3; grid-column:2; font-family:var(--display); font-size:54px; line-height:1; color:var(--mc); align-self:center; font-variant-numeric:tabular-nums}
.mcard .meta{grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:14px; color:var(--muted)}
.stars{letter-spacing:2px; font-size:18px; color:var(--line)}
.stars .on{color:var(--amber)}
.extras{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:14px; margin-top:14px}
.xcard{text-align:right; background:var(--bg2); border:1px dashed var(--line); border-radius:var(--r); padding:16px; display:flex; gap:12px; align-items:center}
.xcard .emo{font-size:32px}
.xcard h3{font-size:19px}
.xcard p{margin:0; font-size:16px; color:var(--muted)}

/* lesson */
.lesson-top{display:flex; gap:12px; align-items:center; justify-content:space-between; padding-block:8px}
.dots{flex:1; min-width:0; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end}
.dots span{width:22px; height:7px; border-radius:9px; background:var(--card2)}
.dots span.on{background:var(--mc)}
.dots span.cur{background:var(--fg)}
.slide{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 20px; margin-top:8px; display:grid; gap:14px; min-height:340px; align-content:start; animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
.slide h2{font-size:clamp(24px,5.5vw,32px)}
.slide .body{max-width:60ch}
.slide .body p{margin:0 0 10px}
.art{display:flex; justify-content:center; font-size:64px; line-height:1}
.art svg{width:100%; max-width:320px; height:auto}
.art.sm svg{max-width:220px}
.tip{background:linear-gradient(135deg,rgba(255,195,77,.14),rgba(255,143,199,.10)); border:1px solid rgba(255,195,77,.45); border-radius:16px; padding:12px 16px; display:grid; gap:4px}
.tip > b:first-child{font-size:15px; letter-spacing:.04em}
.qlabel{font-size:15px; font-weight:700; letter-spacing:.05em; color:var(--mc,var(--teal))}
.lesson-nav{display:flex; justify-content:space-between; gap:10px; margin-top:14px}
.lesson-top{flex-wrap:wrap}
.opts{display:grid; gap:10px}
.opt{text-align:right; background:var(--bg2); border:2px solid var(--line); border-radius:14px; padding:14px 16px; font-size:19px; transition:transform .1s, border-color .2s, background .2s}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--sky)}}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good); background:rgba(95,224,160,.16)}
.opt.wrong{border-color:var(--bad); background:rgba(255,111,125,.12); animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.fb{border-radius:14px; padding:12px 16px; font-size:18px}
.fb.good{background:rgba(95,224,160,.13); border:1px solid rgba(95,224,160,.5)}
.fb.bad{background:rgba(255,111,125,.11); border:1px solid rgba(255,111,125,.5)}
.fb strong{display:block; font-size:19px}
.big-item{display:flex; flex-direction:column; align-items:center; gap:6px; padding-block:12px; font-family:var(--display); font-size:30px}
.big-item .emo{font-size:52px; line-height:1}
.bin{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.bin .opt{text-align:center; font-weight:700}
.row-next{display:flex; justify-content:flex-start}

/* reveal tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:10px; align-items:start}
.tile{display:block; width:100%; text-align:right; background:var(--bg2); border:2px solid var(--line); border-radius:16px; padding:12px 14px}
.tile.open{border-color:var(--mc); background:var(--card2)}
.tile-h{display:flex; align-items:center; gap:10px}
.tile-h .emo{font-size:26px; line-height:1}
.tile-h .nm{flex:1; font-weight:700; font-size:19px}
.tile-h .tg{font-size:15px; color:var(--muted)}
.tile-b{display:none; margin-top:6px}
.tile.open .tile-b{display:block}
/* definition / example / comparison boxes */
.lab-box{display:block; border:1px solid; border-radius:14px; padding:10px 14px; margin-block:8px; text-align:right}
.lab-box .lab{display:inline-block; font-size:14px; font-weight:800; letter-spacing:.03em; border-radius:999px; padding:1px 11px; margin-bottom:4px}
.lab-box .lb-t{display:block}
.lab-box.def{background:rgba(108,196,255,.08); border-color:rgba(108,196,255,.5)}
.lab-box.def .lab{background:var(--sky); color:#0C1527}
.lab-box.ex{background:rgba(255,122,107,.08); border-color:rgba(255,122,107,.55)}
.lab-box.ex .lab{background:var(--coral); color:#2A0D08}
.lab-box.cmp{background:rgba(174,145,255,.08); border-color:rgba(174,145,255,.5)}
.lab-box.cmp .lab{background:var(--violet); color:#140B2E}
.homebtn{white-space:nowrap; background:var(--card2); border:2px solid var(--sky); color:var(--fg); border-radius:12px; padding:8px 14px; font-weight:700; font-size:16px}
.lesson-nav .btn:not(.primary){background:var(--card)}
.tile-in{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
.tile.open .tile-in{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px; text-align:center}
.face.front{background:var(--bg2); border:2px solid var(--line)}
.face.front .emo{font-size:30px; line-height:1}
.face.front .nm{font-weight:700; font-size:17px}
.face.front small{color:var(--muted); font-size:12px}
.face.back{transform:rotateY(180deg); background:var(--card2); border:2px solid var(--mc); font-size:14.5px; line-height:1.45}
.face.back .nm{font-weight:700; color:var(--mc); font-size:15px}
.counter{font-size:16px; color:var(--muted)}

/* cell explorer */
.cell-wrap{display:grid; gap:12px}
.toggle{display:inline-flex; background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:4px; justify-self:center}
.toggle button{background:none; border:0; border-radius:999px; padding:8px 14px; font-weight:700; font-size:16px; color:var(--muted)}
.toggle button.on{background:var(--card2); color:var(--fg)}
.cellsvg{width:100%; max-width:440px; height:auto; justify-self:center; display:block; margin-inline:auto}
.cellsvg .plant-only{display:none}
.cellsvg.plant .plant-only{display:inline}
.cellsvg.plant .animal-only{display:none}
.cyto{fill:var(--cyto)}
.mem{fill:none; stroke:var(--sky); stroke-width:4}
.wall{fill:none; stroke:var(--wall); stroke-width:12}
.hit{fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer}
.nuc{fill:rgba(174,145,255,.35); stroke:var(--violet); stroke-width:3}
.nucleolus{fill:var(--violet)}
.chromatin{fill:none; stroke:var(--violet); stroke-width:2; opacity:.8}
.mito{fill:rgba(255,122,107,.35); stroke:var(--coral); stroke-width:3}
.cristae{fill:none; stroke:var(--coral); stroke-width:2}
.ribo{fill:var(--amber)}
.chl{fill:rgba(125,214,127,.45); stroke:var(--leaf); stroke-width:2.5}
.grana{fill:var(--leaf)}
.vac{fill:var(--vac); stroke:var(--sky); stroke-width:2; stroke-dasharray:5 4}
[data-org]{cursor:pointer}
.cellsvg [data-org]:hover{filter:brightness(1.35)}
.cellsvg .sel{filter:drop-shadow(0 0 6px #fff) brightness(1.3)}
.cellsvg .hit.sel{stroke:rgba(255,255,255,.35)}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.chip{background:var(--bg2); border:2px solid var(--line); border-radius:999px; padding:8px 14px; font-size:17px}
.chip.seen{border-color:var(--teal)}
.chip.seen::before{content:"✓ "; color:var(--teal)}
.chip.cur{background:var(--card2); border-color:var(--amber)}
.info{background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:14px 16px; min-height:120px; display:grid; gap:6px; align-content:start}
.info h3{font-size:22px}
.info .city{color:var(--amber); font-weight:700}
.info .where{justify-self:start; font-size:15px; border-radius:999px; padding:2px 10px; background:var(--card2)}
.info .where.plant{color:var(--leaf); border:1px solid var(--leaf)}
.info .empty{color:var(--muted)}

/* compare */
.compare{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.compare > div{background:var(--bg2); border-radius:14px; padding:12px; border:1px solid var(--line)}
.compare h3{font-size:18px; margin-bottom:6px}
.compare ul{margin:0; padding-inline-start:18px; font-size:17px}
.compare .pl{border-color:var(--leaf)}
.compare .pl h3{color:var(--leaf)}

/* zoom */
.zoom-trail{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:16px; color:var(--muted)}
.zoom-trail span.now{color:var(--fg); font-weight:700; background:var(--card2); border-radius:999px; padding:2px 10px}
.zoom-stage{display:grid; gap:10px; justify-items:center; text-align:center; animation:zin .45s ease}
@keyframes zin{from{transform:scale(.6)}to{transform:none}}
.zoom-stage svg{width:100%; max-width:300px; height:auto}
.zoom-stage .an{font-size:15px; color:var(--amber); font-weight:700; background:rgba(255,195,77,.1); border-radius:999px; padding:4px 14px}
.zoom-stage p{margin:0; max-width:52ch}

/* DNA bits */
.b-A{stroke:var(--coral)} .b-T{stroke:var(--amber)} .b-C{stroke:var(--teal)} .b-G{stroke:var(--violet)}
.bg-A{background:var(--coral)} .bg-T{background:var(--amber)} .bg-C{background:var(--teal)} .bg-G{background:var(--violet)}
.rail{fill:none; stroke:var(--sky); stroke-width:4; stroke-linecap:round}
.chrom{fill:var(--violet)}
.cen{fill:var(--pink)}
.lbl{fill:var(--fg); font-family:var(--body); font-size:12px; font-weight:700}
.lbl.dk{fill:#10162A}
.strand{display:flex; gap:8px; justify-content:center; direction:ltr; flex-wrap:wrap}
.base{width:46px; height:52px; border-radius:12px; display:grid; place-items:center; font-family:var(--display); font-size:26px; color:#10162A}
.base.empty{background:var(--bg2); border:2px dashed var(--line); color:var(--muted)}
.base.cur{border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,195,77,.3)}
.bond{height:14px; width:4px; background:var(--line); margin:auto}
.pcol{display:grid; gap:2px}
.keys{display:flex; gap:10px; justify-content:center; direction:ltr}
.keys button{width:62px; height:56px; border-radius:14px; border:0; font-family:var(--display); font-size:26px; color:#10162A}
.keys button:hover{transform:translateY(-2px)}
.letters{display:flex; justify-content:center; gap:22px; direction:ltr; font-family:var(--display); font-size:54px; line-height:1}
.letters .pair{display:flex; gap:6px; align-items:center; background:var(--bg2); border-radius:16px; padding:8px 16px}
.letters .pair i{font-style:normal; font-size:24px; color:var(--muted)}

/* order game */
.order-ans{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.slot{min-width:64px; min-height:44px; border:2px dashed var(--line); border-radius:12px; display:grid; place-items:center; color:var(--muted); padding:4px 10px; font-size:17px}
.slot.full{border-style:solid; border-color:var(--good); color:var(--fg); background:rgba(95,224,160,.12); font-weight:700}
.gt{color:var(--muted)}
.order-pool{display:flex; flex-wrap:wrap; gap:10px}
.order-pool .chip{font-size:19px; padding:10px 18px}
.chip.shake{animation:shake .35s; border-color:var(--bad)}

/* finish, boss, cards */
.finish{text-align:center; display:grid; gap:14px; justify-items:center; padding-block:30px}
.stars-big{font-size:60px; letter-spacing:6px; color:var(--card2)}
.stars-big .on{color:var(--amber); text-shadow:0 0 18px rgba(255,195,77,.6)}
.recap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 20px; text-align:right; max-width:520px; width:100%}
.recap h3{font-size:18px; color:var(--teal); margin-bottom:6px}
.recap ol{margin:0; padding-inline-start:20px}
.btns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.hearts{font-size:24px; letter-spacing:4px}
.boss-top{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-block:8px}
.prog{height:8px; background:var(--card2); border-radius:9px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--coral); transition:width .4s}
.fcard{perspective:1000px; height:300px; background:none; border:0; padding:0; width:100%}
.fcard .tile-in{border-radius:22px}
.fcard.open .tile-in{transform:rotateY(180deg)}
.fcard .face{font-size:21px; padding:24px; border-radius:22px}
.fcard .face.front{background:var(--card); font-family:var(--display); font-size:26px}
.fcard .face.back{background:var(--card2); border-color:var(--teal); font-size:20px; line-height:1.55}
.fcard small{font-family:var(--body); font-size:16px; color:var(--muted)}

/* plan */
.days{display:grid; gap:10px}
.day{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer}
.day input{width:24px; height:24px; accent-color:var(--good); grid-row:1/span 2}
.day .dname{font-weight:700}
.day .dname small{color:var(--muted); font-weight:400}
.day .what{color:var(--muted); font-size:17px}
.day.test{border-color:var(--coral)}
.day.checked{opacity:.65}
.day.checked .dname{text-decoration:line-through}
details.parent{margin-top:18px; background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:12px 16px}
details.parent summary{cursor:pointer; font-weight:700}
details.parent ul{margin:10px 0 0; padding-inline-start:20px; display:grid; gap:6px; font-size:16px}

/* overlays */
#confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--amber); color:#1B1405; font-weight:700; padding:10px 20px; border-radius:999px; z-index:70; box-shadow:0 8px 30px rgba(0,0,0,.4); animation:pop .3s; max-width:calc(100% - 32px); text-align:center}
.floatxp{position:fixed; z-index:65; pointer-events:none; color:var(--amber); font-weight:800; font-size:20px; animation:up 1s ease forwards}
@keyframes up{to{transform:translateY(-50px); opacity:0}}
.ov{position:fixed; inset:0; z-index:80; background:rgba(8,12,24,.86); display:grid; place-items:center; padding:16px}
.ov-box{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px; max-width:420px; width:100%; display:grid; gap:12px; text-align:center}
.ov-box ul{text-align:right; margin:0; padding-inline-start:20px}
.ov-box .big{font-family:var(--display); font-size:44px; color:var(--teal); font-variant-numeric:tabular-nums}

.sb{display:block; height:.5em}
.face .sb{height:.25em}

@media (max-width:480px){
  .slide{padding:20px 16px}
  .dots{order:3; flex-basis:100%; justify-content:flex-start}
  .compare{grid-template-columns:1fr}
  .brand{display:none}
  .xp{padding:4px 10px}
  .bar{gap:8px; position:static}
  .pill{padding:6px 10px}
  .xpbar{min-width:80px}
  .base{width:40px; height:46px; font-size:22px}
  .keys button{width:54px}
}

<script>
/* ---------- helpers & state ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const KEY = 'cell-quest-v1';
let S = { xp: 0, stars: {}, plan: {}, sound: true };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

const LEVELS = [[0,'נוקלאוטיד'],[60,'גן'],[140,'כרומוזום'],[240,'גרעין'],[360,'תא'],[500,'רקמה'],[650,'איבר'],[800,'אלוף המדעים']];
function levelInfo() {
  let i = 0; LEVELS.forEach((l, k) => { if (S.xp >= l[0]) i = k; });
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { idx: i, name: cur[1], pct: nxt ? (S.xp - cur[0]) / (nxt[0] - cur[0]) : 1 };
}
function renderBar() {
  const L = levelInfo();
  $('#lvlName').textContent = 'רמה: ' + L.name;
  $('#xpNum').textContent = S.xp + ' XP';
  $('#xpFill').style.width = Math.round(L.pct * 100) + '%';
  $('#soundBtn').textContent = S.sound ? '🔊' : '🔇';
  $('#ttsBtn').classList.toggle('on', !!S.tts);
}
function addXP(n, el) {
  const before = levelInfo().idx;
  S.xp += n; save(); renderBar(); floatXP(n, el);
  if (levelInfo().idx > before) {
    setTimeout(() => { toast('רמה חדשה: ' + levelInfo().name); confetti(); sfx('level'); }, 400);
  }
}
function floatXP(n, el) {
  const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
  const s = document.createElement('span');
  s.className = 'floatxp'; s.textContent = '+' + n + ' XP';
  s.style.left = (r.left + r.width / 2 - 30) + 'px'; s.style.top = (r.top - 10) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
}
let toastT;
function toast(msg) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* sound */
let actx;
function sfx(type) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const notes = { good: [660, 880], bad: [200, 160], level: [523, 659, 784, 1046], flip: [520] }[type] || [440];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09, vol = type === 'bad' ? 0.05 : 0.16;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.22);
    });
  } catch (e) {}
}

/* confetti */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = null;
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#FF7A6B', '#FFC34D', '#3ED8C3', '#AE91FF', '#7DD67F', '#FF8FC7'];
  for (let i = 0; i < 80; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 15, vy: -Math.random() * 13 - 4, s: Math.random() * 8 + 4, c: cols[i % 6], r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0 });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 20 && p.life < 240);
  if (parts.length) raf = requestAnimationFrame(loop); else { raf = null; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* focus timer */
let timerEnd = 0, timerInt = null;
function renderTimer(left) {
  const b = $('#timerBtn');
  if (!timerEnd) { $('#timerTxt').textContent = '10 דק׳'; b.classList.remove('on'); return; }
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  $('#timerTxt').textContent = m + ':' + String(s).padStart(2, '0'); b.classList.add('on');
}
function tick() {
  const left = Math.max(0, timerEnd - Date.now());
  if (left <= 0) { clearInterval(timerInt); timerEnd = 0; renderTimer(); showBreak(); return; }
  renderTimer(left);
}
$('#timerBtn').onclick = () => {
  if (timerEnd) { clearInterval(timerInt); timerEnd = 0; renderTimer(); toast('הטיימר נעצר'); return; }
  timerEnd = Date.now() + 10 * 60 * 1000; timerInt = setInterval(tick, 1000); tick();

function showBreak() {
  sfx('level'); confetti();

}

/* read aloud (Hebrew text-to-speech) */
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let READ = '', heVoice = null, voicesLoaded = false;
function pickVoice() {
  if (!TTS) return;
  const v = speechSynthesis.getVoices();

}
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function clean(t) {
  const d = document.createElement('div'); d.innerHTML = String(t).replace(/<span class="lab">([^<]*)<\/span>/g, ' $1: ').replace(/<br\s*\/?>|<\/(p|li|h\d|div)>/gi, '. ');

}
function speak(t) {
  if (!TTS || !t) return;

/* ---------- router ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-say]')) { speak(READ); return; }
  const a = e.target.closest('[data-act="home"]'); if (a) { renderHome(); return; }
  const g = e.target.closest('[data-go]'); if (!g) return;
  const [v, arg] = g.dataset.go.split(':');
  if (v === 'mission') startMission(arg); else if (v === 'boss') startBoss(); else if (v === 'cards') startCards(); else if (v === 'plan') renderPlan();
});
function toTop() { window.scrollTo({ top: 0 }); }
function starsHTML(n) { return '<span class="stars">' + [1, 2, 3].map(k => `<span class="${k <= (n || 0) ? 'on' : ''}">★</span>`).join('') + '</span>'; }

/* ---------- home ---------- */
function daysLeft() {
  const now = new Date(); const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(2026, 9, 19) - t0) / 864e5);
}
function renderHome() {
  toTop(); M = null; hush(); READ = '';
  const d = daysLeft();
  const countTxt = d > 1 ? `<span class="cnum">${d}</span><span>ימים לבוחן<br><small>יום שני, 19.10</small></span>`
    : d === 1 ? `<span class="cnum">1</span><span>הבוחן מחר!<br><small>יום שני, 19.10</small></span>`
    : d === 0 ? `<span class="cnum">0</span><span>הבוחן היום<br><small>בהצלחה</small></span>`
    : `<span class="cnum">✓</span><span>הבוחן עבר<br><small>אפשר להמשיך לתרגל</small></span>`;
  const next = MISSIONS.find(m => !S.stars[m.id]);
  const cta = next ? `<button class="btn primary big" data-go="mission:${next.id}">${S.xp ? 'להמשיך' : 'להתחיל'}: משימה ${next.num} ←</button>`
    : `<button class="btn primary big" data-go="boss">למבחן הסיכום ←</button>`;
  app.innerHTML = `
  <section class="hero">
    <div class="count">${countTxt}</div>
    <h1>מסע אל תוך התא</h1>
    <p>3 משימות קצרות, ובסוף מבחן סיכום על כל החומר. כל משימה לוקחת בערך 10 דקות. כל תשובה נכונה נותנת נקודות (XP), והנקודות מעלות אותך ברמה. כל רמה נקראת על שם חלק בגוף, מהקטן לגדול: נוקלאוטיד, גן, כרומוזום, גרעין, תא, רקמה, איבר, ובסוף אלוף המדעים.</p>
    ${cta}
  </section>
  <h2 class="sec-h">המפה</h2>
  <div class="missions">
    ${MISSIONS.map(m => `<button class="mcard" style="--mc:var(${m.color})" data-go="mission:${m.id}">
      <span class="tag">משימה ${m.num}</span><h3>${m.title}</h3><p>${m.sub}</p><span class="num" aria-hidden="true">0${m.num}</span>
      <span class="meta"><span>~${m.mins} דקות</span>${starsHTML(S.stars[m.id])}</span></button>`).join('')}
    <button class="mcard" style="--mc:var(--pink)" data-go="boss">
      <span class="tag">שלב אחרון</span><h3>מבחן סיכום</h3><p>12 שאלות מכל החומר. יש לך 3 לבבות, וכל טעות מורידה לב.</p><span class="num" aria-hidden="true">04</span>
      <span class="meta"><span>~8 דקות</span>${starsHTML(S.stars.boss)}</span></button>
  </div>
  <div class="extras">
    <button class="xcard" data-go="cards"><span><h3>שליפה מהירה</h3><p>20 כרטיסיות. מושלם ל-5 דקות לפני הבוחן.</p></span></button>
    <button class="xcard" data-go="plan"><span><h3>התכנית עד הבוחן</h3><p>מה עושים בכל יום, עד יום שני.</p></span></button>
  </div>`;
}

/* ---------- mission engine ---------- */
let M = null;
function startMission(id) { M = { m: MISSIONS.find(x => x.id === id), i: 0, mistakes: 0, seen: new Set() }; renderSlide(); }
function done() { if (M) M.seen.add(M.i); const n = $('#next'); if (n && n.disabled) { n.disabled = false; n.classList.add('pulse'); } }
// XP only the first time a slide is completed, so going back and forth does not farm points
function xp(n, el) { if (M && M.seen.has(M.i)) return; addXP(n, el); }
function fb(el, ok, html) {
  const f = $('.fb', el); f.hidden = false; f.className = 'fb ' + (ok ? 'good' : 'bad'); f.innerHTML = `<strong>${ok ? 'נכון.' : 'לא מדויק.'}</strong>${html || ''}`;
  if (S.tts) speak((ok ? 'נכון. ' : 'לא מדויק. ') + (html || ''));
  setTimeout(() => { const t = $('.row-next:not([hidden])', el) || $('#next') || f; try { t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }, 50);
}
function miss() { if (M) M.mistakes++; }

function renderSlide() {
  toTop();
  const { m, i } = M, sl = m.slides[i];
  app.innerHTML = `<section class="lesson" style="--mc:var(${m.color})">
    <div class="lesson-top"><span style="display:flex; gap:8px"><button class="homebtn" data-act="home">🏠 לדף הראשי</button>${sayBtn()}</span>
      <div class="dots" aria-label="שלב ${i + 1} מתוך ${m.slides.length}">${m.slides.map((_, k) => `<span class="${k < i ? 'on' : k === i ? 'cur' : ''}"></span>`).join('')}</div></div>
    <div class="slide" id="slide"></div>
    <div class="lesson-nav">${i > 0 ? '<button class="btn" id="prev">→ הקודם</button>' : '<span></span>'}<button class="btn primary" id="next" disabled>${i === m.slides.length - 1 ? 'סיום משימה' : 'הבא ←'}</button></div>
  </section>`;
  const el = $('#slide');
  const wasSeen = M.seen.has(i);
  ({ info: rInfo, quiz: rQuiz, reveal: rReveal, binary: rBinary, cell: rCell, zoom: rZoom, pair: rPair, order: rOrder })[sl.t](sl, el);
  if (wasSeen) { const n = $('#next'); n.disabled = false; n.classList.remove('pulse'); }
  $('#next').onclick = () => { M.i++; if (M.i >= m.slides.length) finishMission(); else renderSlide(); };
  const p = $('#prev'); if (p) p.onclick = () => { hush(); M.i--; renderSlide(); };
}

function rInfo(sl, el) {
  el.innerHTML = `${sl.art ? `<div class="art">${sl.art}</div>` : ''}<h2>${sl.h}</h2><div class="body">${sl.body}</div>${sl.tip ? `<div class="tip"><b>💡 טריק לזכירה</b>${sl.tip}</div>` : ''}`;
  setRead(sl.h + '. ' + sl.body.replace(/<div class="compare">[\s\S]*<\/div><\/div>/, 'בתא של בעל חיים יש: קרום התא, ציטופלסמה, גרעין, מיטוכונדריה וריבוזומים. בתא צמחי יש את כל אלה, וגם: דופן התא, כלורופלסטים וחלולית גדולה.') + (sl.tip ? '. טריק לזכירה: ' + sl.tip : ''));
  done();
}

function rQuiz(sl, el) {
  let tries = 0;
  const order = sl.opts.length > 2 ? shuffle(sl.opts.map((_, k) => k)) : sl.opts.map((_, k) => k);
  el.innerHTML = `<div class="qlabel">שאלה</div><h2>${sl.q}</h2>
    <div class="opts">${order.map(k => `<button class="opt" data-k="${k}">${sl.opts[k]}</button>`).join('')}</div><div class="fb" hidden></div>`;
  setRead('שאלה. ' + sl.q + '. האפשרויות: ' + order.map(k => sl.opts[k]).join('. '));
  $$('.opt', el).forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (k === sl.a) {
      b.classList.add('right'); $$('.opt', el).forEach(x => x.disabled = true);
      fb(el, true, sl.ex); sfx('good'); if (tries === 0) xp(10, b); done();
    } else {
      tries++; miss(); b.classList.add('wrong'); b.disabled = true; sfx('bad');
      fb(el, false, sl.hint || 'לא זה. נסה תשובה אחרת!');
    }
  });
}

function rReveal(sl, el) {
  const seen = new Set();
  el.innerHTML = `<h2>${sl.h}</h2><p style="margin:0">${sl.intro}</p>
    <div class="tiles">${sl.tiles.map((t, k) => `<button class="tile" data-k="${k}" aria-expanded="false">
      <span class="tile-h"><span class="emo">${t.icon}</span><span class="nm">${t.nm}</span><span class="tg">פתח ▾</span></span>
      <span class="tile-b">${DEF(t.def)}${EX(t.ex)}</span></button>`).join('')}</div>
    <div class="counter" id="cnt">פתחת 0 מתוך ${sl.tiles.length}</div>`;
  setRead(sl.h + '. ' + sl.intro);
  $$('.tile', el).forEach(b => b.onclick = () => {
    const open = b.classList.toggle('open'); sfx('flip');
    b.setAttribute('aria-expanded', open); $('.tg', b).textContent = open ? 'סגור ▴' : 'פתח ▾';
    const t = sl.tiles[+b.dataset.k];
    if (open) { READ = t.nm + '. הגדרה: ' + t.def + ' דוגמה: ' + t.ex; if (S.tts) speak(READ); }
    if (!seen.has(b.dataset.k)) { seen.add(b.dataset.k); xp(2, b); }
    $('#cnt').textContent = `פתחת ${seen.size} מתוך ${sl.tiles.length}` + (seen.size === sl.tiles.length ? ' ✓' : '');
    if (seen.size === sl.tiles.length) done();
  });
}

function rBinary(sl, el) {
  const items = shuffle([...sl.items]); let j = 0;
  const draw = () => {
    if (j >= items.length) { el.innerHTML = `<h2 style="text-align:center">סיימת את הסבב. המשך לשלב הבא.</h2>`; done(); return; }
    const it = items[j];
    el.innerHTML = `<div class="qlabel">${sl.h} · ${j + 1} מתוך ${items.length}</div>
      <div class="big-item"><span class="emo">${it.icon}</span><span>${it.name}</span></div>
      <div class="bin">${sl.labels.map((l, k) => `<button class="opt" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="fb" hidden></div><div class="row-next" hidden><button class="btn">הבא ←</button></div>`;
    setRead(it.name + '. ' + sl.labels.join(', או ') + '?');
    let answered = false;
    $$('.bin .opt', el).forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = +b.dataset.k === it.a;
      if (ok) { b.classList.add('right'); sfx('good'); xp(5, b); }
      else { b.classList.add('wrong'); $(`.bin .opt[data-k="${it.a}"]`, el).classList.add('right'); miss(); sfx('bad'); }
      $$('.bin .opt', el).forEach(x => x.disabled = true);
      fb(el, ok, it.ex);
      const rn = $('.row-next', el); rn.hidden = false; const nb = $('button', rn); nb.focus(); nb.onclick = () => { j++; draw(); };
    });
  };
  draw();
}

function rCell(sl, el) {
  const seen = new Set(); let plant = false;
  el.innerHTML = `<h2>${sl.h}</h2><p style="margin:0">${sl.intro}</p>
    <div class="cell-wrap">
      <div class="toggle" role="group" aria-label="סוג התא"><button class="on" data-mode="animal">🐾 תא של בעל חיים</button><button data-mode="plant">🌱 תא צמחי</button></div>
      ${CELL_SVG}
      <div class="chips">${ORG_ORDER.map(k => `<button class="chip" data-chip="${k}">${ORG[k].name}</button>`).join('')}</div>
      <div class="info" id="orgInfo"><span class="empty">לחץ על חלק בתא או על אחד השמות.</span></div>
      <div class="counter" id="cnt">גילית 0 מתוך 8</div>
    </div>`;
  setRead(sl.h + '. ' + sl.intro);
  const svg = $('#cellsvg', el);
  const setMode = p => { plant = p; svg.classList.toggle('plant', p); $$('.toggle button', el).forEach(b => b.classList.toggle('on', (b.dataset.mode === 'plant') === p)); };
  $$('.toggle button', el).forEach(b => b.onclick = () => setMode(b.dataset.mode === 'plant'));
  const show = k => {
    const o = ORG[k];
    if (o.plant && !plant) setMode(true);
    $$('.sel', svg).forEach(x => x.classList.remove('sel'));
    $$(`[data-org="${k}"]`, svg).forEach(x => x.classList.add('sel'));
    $$('.chip', el).forEach(c => c.classList.toggle('cur', c.dataset.chip === k));
    $('#orgInfo').innerHTML = `<h3>${o.icon} ${o.name}</h3>${DEF(o.fn)}${CMP('בעיר שלנו: ' + o.city + '.')}
      <span class="where ${o.plant ? 'plant' : ''}">${o.plant ? '🌱 רק בתא צמחי' : '🌱🐾 בשני סוגי התאים'}</span>`;
    READ = o.name + '. הגדרה: ' + o.fn + ' השוואה: בעיר שלנו, ' + o.city + '. ' + (o.plant ? 'נמצא רק בתא צמחי.' : 'נמצא בשני סוגי התאים.');
    if (S.tts) speak(READ);
    if (!seen.has(k)) { seen.add(k); xp(3, $(`[data-chip="${k}"]`, el)); $(`[data-chip="${k}"]`, el).classList.add('seen'); sfx('good'); }
    $('#cnt').textContent = `גילית ${seen.size} מתוך 8` + (seen.size === 8 ? ' ✓ סיירת בכל העיר!' : (seen.size >= 5 && !plant ? ' · נסה את התא הצמחי' : ''));
    if (seen.size === 8) done();
  };
  svg.addEventListener('click', e => { const t = e.target.closest('[data-org]'); if (t) show(t.dataset.org); });
  $$('.chip', el).forEach(c => c.onclick = () => show(c.dataset.chip));
}

function rZoom(sl, el) {
  let k = 0;
  const draw = () => {
    const L = sl.levels[k];
    el.innerHTML = `<h2>${sl.h}</h2>
      <div class="zoom-trail">${sl.levels.slice(0, k + 1).map((x, n) => `<span class="${n === k ? 'now' : ''}">${x.name}</span>`).join('<span>←</span>')}</div>
      <div class="zoom-stage"><h3 style="font-size:30px">${L.name}</h3>${L.art}<div style="width:100%">${DEF(L.text)}${L.ex ? EX(L.ex) : ''}${CMP(L.an)}</div></div>
      <div class="row-next">${k < sl.levels.length - 1 ? `<button class="btn" id="zin">זום פנימה ←</button>` : '<span class="counter">✓ הגעת ליחידה הקטנה ביותר.</span>'}</div>`;
    setRead(L.name + '. הגדרה: ' + L.text + (L.ex ? ' דוגמה: ' + L.ex : '') + ' השוואה: ' + L.an + '.');
    const z = $('#zin', el); if (z) z.onclick = () => { k++; sfx('flip'); draw(); };
    if (k === sl.levels.length - 1) { xp(10, $('.zoom-stage', el)); done(); }
  };
  draw();
}

function rPair(sl, el) {
  const P = { A: 'T', T: 'A', C: 'G', G: 'C' };
  const strand = shuffle(['A', 'T', 'C', 'G', 'ATCG'[Math.random() * 4 | 0], 'ATCG'[Math.random() * 4 | 0]]);
  let k = 0, firstTry = true;
  el.innerHTML = `<div class="qlabel">משחק</div><h2>${sl.h}</h2><p style="margin:0">${sl.intro}</p>
    <div class="strand" id="strand"></div>
    <div class="keys">${['A', 'T', 'C', 'G'].map(b => `<button class="bg-${b}" data-b="${b}">${b}</button>`).join('')}</div>
    <div class="fb" hidden></div>`;
  setRead(sl.h + '. ' + sl.intro + ' זכור: A עם T, C עם G.');
  const draw = () => {
    $('#strand').innerHTML = strand.map((b, n) => `<div class="pcol"><div class="base bg-${b}">${b}</div><div class="bond"></div>
      ${n < k ? `<div class="base bg-${P[b]}">${P[b]}</div>` : `<div class="base empty ${n === k ? 'cur' : ''}">?</div>`}</div>`).join('');
  };
  draw();
  $$('.keys button', el).forEach(btn => btn.onclick = () => {
    if (k >= strand.length) return;
    if (btn.dataset.b === P[strand[k]]) {
      k++; sfx('good'); draw();
      if (k === strand.length) { fb(el, true, 'הסולם שלם! ישר עם ישר (A–T), עגול עם עגול (C–G).'); xp(firstTry ? 15 : 8, $('#strand')); done(); }
    } else {
      firstTry = false; miss(); sfx('bad');
      fb(el, false, `ל-${strand[k]} מתאים רק ${P[strand[k]]}. ${'AT'.includes(strand[k]) ? 'ישר עם ישר!' : 'עגול עם עגול!'}`);
    }
  });
}

function rOrder(sl, el) {
  const correct = sl.items; let pool = shuffle([...correct]);
  while (pool.join() === correct.join()) pool = shuffle([...correct]);
  let k = 0, firstTry = true;
  el.innerHTML = `<div class="qlabel">משחק סידור</div><h2>${sl.h}</h2><p style="margin:0">לחץ על המילים לפי הסדר: קודם הכי גדול.</p>
    <div class="order-ans">${correct.map((_, n) => `<span class="slot" data-n="${n}">${n + 1}</span>`).join('<span class="gt">←</span>')}</div>
    <div class="order-pool">${pool.map(x => `<button class="chip" data-v="${x}">${x}</button>`).join('')}</div><div class="fb" hidden></div>`;
  setRead(sl.h + '. לחץ על המילים לפי הסדר, קודם הכי גדול: ' + pool.join(', '));
  $$('.order-pool .chip', el).forEach(c => c.onclick = () => {
    if (c.dataset.v === correct[k]) {
      const s = $(`.slot[data-n="${k}"]`, el); s.textContent = c.dataset.v; s.classList.add('full'); c.remove(); k++; sfx('good');
      $('.fb', el).hidden = true;
      if (k === correct.length) { fb(el, true, 'בית ← ספרייה ← ספר ← מתכון ← אות.'); xp(firstTry ? 15 : 8, $('.order-ans', el)); done(); }
    } else {
      firstTry = false; miss(); sfx('bad'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      fb(el, false, 'לא זה. מה הכי גדול מבין מה שנשאר? (חשוב על בית ← ספרייה ← ספר ← מתכון ← אות)');
    }
  });
}

function finishMission() {
  toTop();
  const { m, mistakes } = M;
  const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
  const first = !S.stars[m.id];
  S.stars[m.id] = Math.max(S.stars[m.id] || 0, stars); save();
  const idx = MISSIONS.indexOf(m), nxt = MISSIONS[idx + 1];
  app.innerHTML = `<section class="finish" style="--mc:var(${m.color})">
    <div class="stars-big">${[1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}">★</span>`).join('')}</div>
    <h2 style="font-size:34px">משימה ${m.num} הושלמה!</h2>
    <p style="margin:0; color:var(--muted)">${stars === 3 ? 'מושלם! כמעט בלי טעויות.' : stars === 2 ? 'יפה מאוד! עוד סיבוב אחד ותגיע ל-3 כוכבים.' : 'סיימת, וזה מה שחשוב. נסה שוב מחר לעוד כוכבים.'}</p>
    <div class="recap"><h3>3 דברים לזכור</h3><ol>${m.recap.map(r => `<li>${r}</li>`).join('')}</ol></div>
    <div class="btns">${nxt ? `<button class="btn primary" data-go="mission:${nxt.id}">למשימה ${nxt.num} ←</button>` : `<button class="btn primary" data-go="boss">למבחן הסיכום ←</button>`}
      <button class="btn" data-act="home">🏠 לדף הראשי</button><button class="btn ghost" data-go="mission:${m.id}">לשחק שוב</button></div>
  </section>`;
  M = null;
  setRead('משימה ' + m.num + ' הושלמה! שלושה דברים לזכור: ' + m.recap.join('. '));
  addXP(first ? 50 : 20, $('.stars-big')); confetti(); sfx('level');
}

/* ---------- boss ---------- */
let B = null;
function startBoss() { M = null; B = { qs: shuffle([...BANK]).slice(0, 12), i: 0, hearts: 3, right: 0 }; drawBoss(); }
function drawBoss() {
  toTop();
  if (B.hearts <= 0) return bossEnd(false);
  if (B.i >= B.qs.length) return bossEnd(true);
  const q = B.qs[B.i], order = q.opts.length > 2 ? shuffle(q.opts.map((_, k) => k)) : [0, 1];
  app.innerHTML = `<section class="lesson" style="--mc:var(--pink)">
    <div class="boss-top"><span style="display:flex; gap:8px"><button class="homebtn" data-act="home">🏠 לדף הראשי</button>${sayBtn()}</span><span class="hearts" aria-label="${B.hearts} לבבות">${'❤️'.repeat(B.hearts)}${'🖤'.repeat(3 - B.hearts)}</span></div>
    <div class="prog"><i style="width:${B.i / B.qs.length * 100}%"></i></div>
    <div class="slide" id="slide"><div class="qlabel">מבחן סיכום · שאלה ${B.i + 1} מתוך ${B.qs.length}</div><h2>${q.q}</h2>
      <div class="opts">${order.map(k => `<button class="opt" data-k="${k}">${q.opts[k]}</button>`).join('')}</div>
      <div class="fb" hidden></div><div class="row-next" hidden><button class="btn primary">הבא ←</button></div></div>
  </section>`;
  const el = $('#slide');
  setRead('שאלה ' + (B.i + 1) + '. ' + q.q + '. האפשרויות: ' + order.map(k => q.opts[k]).join('. '));
  $$('.opt', el).forEach(b => b.onclick = () => {
    const ok = +b.dataset.k === q.a;
    $$('.opt', el).forEach(x => x.disabled = true);
    if (ok) { b.classList.add('right'); B.right++; sfx('good'); addXP(10, b); }
    else { b.classList.add('wrong'); $(`.opt[data-k="${q.a}"]`, el).classList.add('right'); B.hearts--; sfx('bad'); }
    fb(el, ok, q.ex + (ok ? '' : ' (התשובה הנכונה מסומנת בירוק)'));
    const rn = $('.row-next', el); rn.hidden = false; const nb = $('button', rn); nb.focus(); nb.onclick = () => { B.i++; drawBoss(); };
  });
}
function bossEnd(win) {
  if (win) {
    S.stars.boss = Math.max(S.stars.boss || 0, B.hearts); save();
    app.innerHTML = `<section class="finish"><div class="stars-big">${[1, 2, 3].map(k => `<span class="${k <= B.hearts ? 'on' : ''}">★</span>`).join('')}</div>
      <h2 style="font-size:36px">עברת את מבחן הסיכום!</h2><p style="margin:0">ענית נכון על ${B.right} מתוך ${B.qs.length} שאלות. אתה מוכן לבוחן.</p>
      <div class="btns"><button class="btn primary" data-go="cards">שליפה מהירה</button><button class="btn" data-act="home">🏠 לדף הראשי</button><button class="btn ghost" data-go="boss">עוד סיבוב</button></div></section>`;
    addXP(100, $('.stars-big')); confetti(); setTimeout(confetti, 600); sfx('level');
  } else {
    app.innerHTML = `<section class="finish"><h2 style="font-size:32px">נגמרו הלבבות הפעם</h2>
      <p style="margin:0; max-width:46ch">כל טעות כאן היא שאלה שלא תפספס בבוחן. ענית נכון על ${B.right} שאלות. בכל ניסיון השאלות מתחלפות, אז נסה שוב.</p>
      <div class="btns"><button class="btn primary" data-go="boss">עוד ניסיון</button><button class="btn" data-go="cards">לחזור על הכרטיסיות</button><button class="btn ghost" data-act="home">🏠 לדף הראשי</button></div></section>`;
  }
}

/* ---------- flashcards ---------- */
let C = null;
function startCards() { M = null; C = { deck: shuffle([...CARDS]), known: 0 }; drawCard(); }
function drawCard() {
  toTop();
  if (!C.deck.length) {
    app.innerHTML = `<section class="finish"><h2 style="font-size:32px">עברת על כל הכרטיסיות</h2><p style="margin:0">ידעת את כולן. אתה מוכן לבוחן.</p>
      <div class="btns"><button class="btn primary" data-go="cards">עוד סיבוב</button><button class="btn" data-act="home">🏠 לדף הראשי</button></div></section>`;
    confetti(); sfx('level'); return;
  }
  const c = C.deck[0];
  app.innerHTML = `<section class="lesson" style="--mc:var(--teal)">
    <div class="lesson-top"><span style="display:flex; gap:8px"><button class="homebtn" data-act="home">🏠 לדף הראשי</button>${sayBtn()}</span><span class="counter">נשארו ${C.deck.length} · ידעת ${C.known}</span></div>
    <div style="display:grid; gap:14px; margin-top:8px">
      <button class="fcard" id="fc" aria-label="הפוך כרטיס"><div class="tile-in">
        <div class="face front"><span>${c.f}</span><small>מה אתה זוכר? לחץ להפוך</small></div>
        <div class="face back"><span>${c.b}</span></div></div></button>
      <div class="bin" id="fcb" style="visibility:hidden"><button class="opt" id="again" style="text-align:center">↺ עוד לא, שוב בהמשך</button><button class="opt" id="knew" style="text-align:center; border-color:var(--good)">✓ ידעתי!</button></div>
    </div></section>`;
  setRead(c.f + '?');
  $('#fc').onclick = () => {
    const open = $('#fc').classList.toggle('open'); $('#fcb').style.visibility = 'visible'; sfx('flip');
    READ = open ? c.b : c.f + '?'; if (S.tts) speak(READ);
  };
  $('#knew').onclick = () => { C.deck.shift(); C.known++; addXP(2, $('#knew')); sfx('good'); drawCard(); };
  $('#again').onclick = () => { C.deck.push(C.deck.shift()); drawCard(); };
}

/* ---------- plan ---------- */
const PLAN = [
  { id: 'd1', name: 'חמישי', date: '15.10', what: 'משימה 1: מאפייני חיים (10 דקות)' },
  { id: 'd2', name: 'שישי', date: '16.10', what: 'משימה 2: מבנה התא ואברונים (15 דקות)' },
  { id: 'd3', name: 'שבת', date: '17.10', what: 'משימה 3: מבנה ה-DNA (15 דקות)' },
  { id: 'd4', name: 'ראשון', date: '18.10', what: 'חזרה בכיתה. בערב: מבחן סיכום + שליפה מהירה (15 דקות)' },
  { id: 'd5', name: 'שני', date: '19.10', what: 'בבוקר: 5 דקות שליפה מהירה, ואז הבוחן. בהצלחה.', test: true }
];
function renderPlan() {
  toTop(); M = null;
  app.innerHTML = `<section>
    <div class="lesson-top"><button class="homebtn" data-act="home">🏠 לדף הראשי</button></div>
    <h2 style="font-size:32px; margin-block:8px 6px">התכנית עד הבוחן</h2>
    <p style="margin:0 0 16px; color:var(--muted)">מעט בכל יום עדיף על הרבה ביום אחד. סמן ✓ כשסיימת.</p>
    <div class="days">${PLAN.map(d => `<label class="day ${d.test ? 'test' : ''} ${S.plan[d.id] ? 'checked' : ''}" for="${d.id}">
      <input type="checkbox" id="${d.id}" ${S.plan[d.id] ? 'checked' : ''}><span class="dname">יום ${d.name} <small>${d.date}</small></span><span class="what">${d.what}</span></label>`).join('')}</div>
  </section>`;
  $$('.day input', app).forEach(cb => cb.onchange = () => {
    S.plan[cb.id] = cb.checked; save(); cb.closest('.day').classList.toggle('checked', cb.checked);
    if (cb.checked) { sfx('good'); toast('יום הושלם ✓'); }
  });
}

/* one sentence per line: after ". " / "! " / "? " start a new line with a small gap */
const SKIP = '.opt, .chip, .btn, .pill, .ghost, .counter, .qlabel, .tag, .zoom-trail, .keys, .strand, svg, script, style';
function splitSentences(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => /[.!?]\s+\S/.test(n.nodeValue) && !(n.parentElement && n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const parts = n.nodeValue.replace(/([.!?])\s+(?=\S)/g, '$1\u0000').split('\u0000');
    const frag = document.createDocumentFragment();
    parts.forEach((p, i) => {
      if (i) { const s = document.createElement('span'); s.className = 'sb'; frag.appendChild(s); }
      frag.appendChild(document.createTextNode(p));
    });
    n.parentNode.replaceChild(frag, n);
  });
}
new MutationObserver(() => splitSentences(app)).observe(app, { childList: true, subtree: true, characterData: true });

renderBar();
renderHome();
splitSentences(app);
</script>
